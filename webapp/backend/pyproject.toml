[project]
name = "langid-backend"
version = "0.1.0"
description = "FastAPI backend for Sinhala-Script LangID Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "minio>=7.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pymupdf>=1.24",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7.0",
    "mypy>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true
