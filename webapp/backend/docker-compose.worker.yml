services:
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: langid-celery-worker
    container_name: langid_celery_worker
    network_mode: "host" # Connects directly to localhost so it can access your local Postgres, Redis, and MinIO without changing the .env file.
    env_file:
      - .env
    volumes:
      - ../../models:/models:ro # Mount models directory from the project root
    restart: unless-stopped

  # Surya OCR on CPU. One process only: each process holds ~4 GB of models in RAM.
  celery_surya_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: langid-celery-worker # same image as celery_worker; the second build is fully cached
    container_name: langid_celery_surya_worker
    network_mode: "host"
    env_file:
      - .env
    environment:
      TORCH_DEVICE: cpu
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "surya", "-c", "1", "-n", "surya@%h", "--loglevel=info"]
    volumes:
      - surya_models:/root/.cache/datalab # Surya downloads its weights here on first use
    restart: unless-stopped

volumes:
  surya_models:
