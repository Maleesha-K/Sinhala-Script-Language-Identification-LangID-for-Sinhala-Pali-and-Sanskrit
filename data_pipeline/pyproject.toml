[project]
name = "data-pipeline"
version = "0.1.0"
description = "Reproducible Sinhala-script language identification pipeline (Sinhala, Pali, Sanskrit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "datasets>=5.0.1",
    "datasketch>=2.0.0",
    "evaluate==0.4.6",
    "fasttext-wheel>=0.9.2",
    "gdown>=5.2.0",
    "huggingface-hub>=0.25.0",
    "ipykernel>=7.3.0",
    "joblib>=1.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbformat>=5.10.4",
    "pandas>=2.0.0",
    "papermill>=2.7.0",
    "peft>=0.21.2",
    "pyyaml>=6.0.3",
    "safetensors==0.8.0",
    "scikit-learn>=1.7.0",
    "torch==2.13.0",
    "tqdm>=4.66.0",
    "transformers==5.14.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install the shared library `lidpipe` and the LID-176 trainer (editable) into the uv environment, so
# every script can `import lidpipe` however it is launched.
[tool.hatch.build.targets.wheel]
packages = ["lidpipe", "fasttext_continual"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# PyTorch with CUDA. On Linux the PyPI wheel already bundles CUDA 13; on Windows
# PyPI only has a CPU-only build, so Windows takes torch from PyTorch's CUDA 13.0
# index (driver >= 580 needed). The pipeline still runs on CPU where no NVIDIA
# GPU exists; preflight reports which device will be used.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
