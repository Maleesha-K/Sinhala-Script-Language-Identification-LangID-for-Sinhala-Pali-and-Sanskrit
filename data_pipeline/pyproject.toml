[project]
name = "data-pipeline"
version = "0.1.0"
description = "Reproducible Sinhala-script language identification pipeline (Sinhala, Pali, Sanskrit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "datasets>=5.0.1",
    "datasketch>=2.0.0",
    "evaluate==0.4.6",
    "fasttext-wheel>=0.9.2",
    "gdown>=5.2.0",
    "huggingface-hub>=0.25.0",
    "ipykernel>=7.3.0",
    "joblib>=1.4.0",
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "pandas>=2.0.0",
    "papermill>=2.7.0",
    "pyyaml>=6.0.3",
    "safetensors==0.8.0",
    "scikit-learn>=1.7.0",
    "torch==2.13.0",
    "tqdm>=4.66.0",
    "transformers==5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install the shared library `lidpipe` (editable) into the uv environment, so
# every script can `import lidpipe` however it is launched.
[tool.hatch.build.targets.wheel]
packages = ["lidpipe"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
